spring.application.name=readings-api
# Configuração do banco H2 (modo arquivo)
spring.datasource.url=jdbc:h2:file:./data/readings
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Console do H2 (opcional, útil para testes)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*

# JWT
jwt.secret=change_this_to_a_strong_secret_key_which_is_long_enough
jwt.expiration-ms=3600000
